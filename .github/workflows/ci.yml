name: CI

# Pull-request validation and main-branch push gate for H3.NET.Native.
# Builds the three native RIDs, lints, runs the managed test matrix (incl. musl),
# packs + verifies the multi-RID nupkg, smoke-tests the PackageReference consumer
# path, runs the valgrind/managed memory gate, and warns (never gates) on benchmarks.

on:
  pull_request:
  push:
    branches: [main]

# Top-level least privilege; individual jobs elevate only as needed (none do here).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build libh3 for each shipped RID. build-native.sh does NOT cross-compile, so the
  # macOS leg runs on an arm64 host (macos-latest) matching osx-arm64; the two linux
  # RIDs are produced via their Dockerfiles (manylinux for glibc baseline, alpine for musl).
  native-build:
    name: native-build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            dockerfile: build/docker/Dockerfile.manylinux
          - rid: linux-musl-x64
            os: ubuntu-latest
            dockerfile: build/docker/Dockerfile.alpine
          - rid: osx-arm64
            os: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      # Linux legs: build inside the pinned base image and export the scratch stage's
      # libh3.so via BuildKit --output. The export stage is FROM scratch (no command),
      # so `docker create` cannot be used on it; --output writes the file to the host.
      - name: Build native via Docker
        if: matrix.dockerfile != ''
        run: |
          mkdir -p "runtimes/${{ matrix.rid }}/native"
          DOCKER_BUILDKIT=1 docker build -f "${{ matrix.dockerfile }}" --target export \
            --output "type=local,dest=runtimes/${{ matrix.rid }}/native" .

      # macOS legs: cmake is preinstalled on the runners; the script builds the host RID.
      - name: Build native via build-native.sh
        if: matrix.dockerfile == ''
        run: bash build/build-native.sh "${{ matrix.rid }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/libh3.*
          retention-days: 1
          if-no-files-found: error

  # Format/analyzer gate. TreatWarningsAsErrors is repo-wide, so dotnet format must
  # report no changes. No native lib needed for a format verification.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 8 + 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.301

      - name: Restore (locked)
        run: dotnet restore H3.NET.Native.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format H3.NET.Native.slnx --verify-no-changes

  # Managed test matrix across the three host RIDs plus a musl/alpine container leg.
  # Each leg downloads the matching native artifact so the eng/ copy target can place
  # libh3 next to the test binaries (ProjectReference path does not auto-propagate it).
  managed-test:
    name: managed-test (${{ matrix.label }})
    needs: native-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            rid: linux-x64
          - label: osx-arm64
            os: macos-latest
            rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Install both SDKs; global.json selects 10.0.301 for builds while the 8.0
      # runtime covers the net8.0 test leg.
      - name: Setup .NET 8 + 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.301

      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native

      - name: Restore (locked)
        run: dotnet restore H3.NET.Native.slnx --locked-mode

      - name: Build
        run: dotnet build H3.NET.Native.slnx -c Release --no-restore

      - name: Test (net10.0)
        run: dotnet test H3.NET.Native.slnx -c Release -f net10.0 --no-build

      - name: Test (net8.0)
        run: dotnet test H3.NET.Native.slnx -c Release -f net8.0 --no-build

      # Code coverage (linux-x64 leg only). Re-runs just the net10.0 test project under
      # the MTP-native coverage extension (Microsoft.Testing.Extensions.CodeCoverage) and
      # emits a cobertura report that the "Enforce coverage threshold" step below gates on
      # (overall line-rate and branch-rate must each be >= 80 percent). This step only
      # produces and uploads the report; the threshold check is a separate step so the
      # artifact still uploads even when the gate fails, keeping a failure diagnosable.
      # The Test steps above are unchanged and run identically on every leg; this extra step is
      # the sole opt-in to instrumentation. --results-directory is an MTP platform option, so it
      # must sit after the `--` separator; an absolute path lands the report deterministically
      # (a project-relative one resolves against the test host cwd and is doubled).
      - name: Coverage (net10.0, cobertura)
        if: matrix.label == 'linux-x64'
        run: >
          dotnet test tests/H3.NET.Native.Tests/H3.NET.Native.Tests.csproj -c Release -f net10.0 --no-build
          -- --coverage --coverage-output-format cobertura --coverage-output h3.cobertura.xml
          --results-directory "${{ github.workspace }}/artifacts/coverage"

      - name: Upload coverage report
        if: matrix.label == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-x64
          path: ${{ github.workspace }}/artifacts/coverage/h3.cobertura.xml
          retention-days: 7
          if-no-files-found: error

      # Coverage gate (linux-x64 only). Parses the cobertura report emitted above and
      # FAILS the job if the overall line-rate or branch-rate is below 80 percent. Uses
      # only the python3 stdlib preinstalled on ubuntu-latest (no third-party actions, so
      # the supply chain stays pinned). Runs AFTER the upload so the report is always
      # captured; the measured percentages are printed so a failing run is diagnosable
      # from the log alone.
      - name: Enforce coverage threshold (line & branch >= 80%)
        if: matrix.label == 'linux-x64'
        run: |
          python3 - "${{ github.workspace }}/artifacts/coverage/h3.cobertura.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          threshold = 0.80
          root = ET.parse(sys.argv[1]).getroot()
          line_rate = float(root.get("line-rate"))
          branch_rate = float(root.get("branch-rate"))

          print(f"line-rate   : {line_rate:.4f} ({line_rate * 100:.2f}%)")
          print(f"branch-rate : {branch_rate:.4f} ({branch_rate * 100:.2f}%)")
          print(f"threshold   : {threshold * 100:.2f}% (line and branch)")

          failures = []
          if line_rate < threshold:
              failures.append(f"line-rate {line_rate * 100:.2f}% < {threshold * 100:.2f}%")
          if branch_rate < threshold:
              failures.append(f"branch-rate {branch_rate * 100:.2f}% < {threshold * 100:.2f}%")

          if failures:
              print("::error::coverage gate failed: " + "; ".join(failures))
              sys.exit(1)

          print("coverage gate passed")
          PY

  # musl/alpine managed tests run via `docker run` (NOT a job `container:`) so the
  # JS-based actions (checkout, download-artifact) execute on the glibc host; only the
  # dotnet commands run inside the musl image, where a job container would otherwise
  # fail because the runner-injected Node is glibc-linked and cannot exec on musl.
  managed-test-musl:
    name: managed-test (linux-musl-x64)
    needs: native-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-musl-x64
          path: runtimes/linux-musl-x64/native

      # SDK 10 is in the alpine image; add the musl .NET 8 runtime (dotnet-install
      # auto-detects musl) so the net8.0 leg runs. The eng/ target copies the
      # linux-musl-x64 native next to the test bins via $(NETCoreSdkRuntimeIdentifier).
      - name: Test in alpine (net10 + net8)
        run: |
          docker run --rm -v "$PWD":/work -w /work mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -euxc '
            apk add --no-cache bash curl icu-libs krb5-libs libgcc libintl libssl3 libstdc++ zlib
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 8.0 --runtime dotnet --install-dir /usr/share/dotnet
            export DOTNET_ROOT=/usr/share/dotnet
            dotnet restore H3.NET.Native.slnx --locked-mode
            dotnet build H3.NET.Native.slnx -c Release --no-restore
            dotnet test H3.NET.Native.slnx -c Release -f net10.0 --no-build
            dotnet test H3.NET.Native.slnx -c Release -f net8.0 --no-build
          '

  # Pack the binding with all three native RIDs present, then assert each RID actually
  # landed under runtimes/<rid>/native/ inside the produced .nupkg.
  pack-and-restore:
    name: pack-and-restore
    needs: native-build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so MinVer sees the full history + tags and stamps the real
      # pre-release version (X.Y.Z-pr.0.<height>) onto the packed nupkg; publish-prerelease
      # ships that exact artifact to GitHub Packages.
      - name: Checkout (full history + tags)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download native linux-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native

      - name: Download native linux-musl-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-musl-x64
          path: runtimes/linux-musl-x64/native

      - name: Download native osx-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-osx-arm64
          path: runtimes/osx-arm64/native

      - name: Setup .NET 8 + 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.301

      - name: Restore (locked)
        run: dotnet restore H3.NET.Native.slnx --locked-mode

      - name: Pack
        run: dotnet pack src/H3.NET.Native/H3.NET.Native.csproj -c Release -o artifacts/feed

      - name: Verify all three RIDs packed
        run: |
          for r in linux-x64 linux-musl-x64 osx-arm64; do
            unzip -l artifacts/feed/*.nupkg | grep -q "runtimes/$r/native/libh3" || { echo "missing $r"; exit 1; }
          done

      - name: Upload nupkg feed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-feed
          path: artifacts/feed
          retention-days: 1
          if-no-files-found: error

  # Publish the MinVer auto pre-release (X.Y.Z-pr.0.<height>) to THIS repo's GitHub
  # Packages NuGet feed on non-fork PR builds, so reviewers can consume per-commit
  # builds without polluting the public nuget.org listing. Fork PRs are SKIPPED: their
  # GITHUB_TOKEN is read-only, so packages:write is unavailable. This job depends on
  # pack-and-restore only to reuse its verified nupkg artifact; consumer-smoke depends
  # on pack-and-restore (not this job), so a push hiccup here never blocks consumers.
  publish-prerelease:
    name: publish-prerelease
    needs: pack-and-restore
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download nupkg feed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-feed
          path: artifacts/feed

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.301

      # --skip-duplicate keeps re-runs idempotent (GitHub Packages versions are
      # immutable); --no-symbols avoids a snupkg push (GH Packages has no symbol server).
      - name: Push pre-release to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          dotnet nuget add source \
            --username "$ACTOR" \
            --password "$GH_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/FOOincognita/index.json"
          dotnet nuget push "artifacts/feed/*.nupkg" \
            --source github \
            --api-key "$GH_TOKEN" \
            --no-symbols \
            --skip-duplicate

  # Validate the true PackageReference native-propagation path (no eng/ help): restore
  # the QuickStart sample from the local feed and assert the expected res-9 SF cell.
  consumer-smoke:
    name: consumer-smoke (${{ matrix.os }})
    needs: pack-and-restore
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download nupkg feed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-feed
          path: artifacts/feed

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.301

      # The sample's nuget.config (<clear/> + nuget.org + ../../artifacts/feed) and a
      # floating *-* PackageReference pull the freshly packed binding from the feed.
      - name: Run QuickStart sample
        run: |
          output=$(dotnet run --project samples/H3.NET.Native.QuickStart -c Release)
          echo "$output"
          echo "$output" | grep -q "08928308280fffff" || { echo "expected cell 08928308280fffff not found in sample output"; exit 1; }

  # Authoritative byte-level leak gate (valgrind over the pure-C harness) plus a
  # managed soak that catches unbounded heap/RSS growth.
  memory-linux:
    name: memory-linux
    needs: native-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # ubuntu is a linux-x64 host, so this builds libh3 natively (no docker) and
      # populates external/h3/build/lib/libh3.so that the C harness links against.
      - name: Build native (linux-x64)
        run: bash build/build-native.sh linux-x64

      - name: Build C leak harness
        run: |
          cmake -B harness-build -S tests/H3.NET.Native.MemoryTests/native-harness -DH3_BUILD_DIR="$PWD/external/h3/build"
          cmake --build harness-build

      - name: Run valgrind leak gate
        run: valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all --error-exitcode=1 ./harness-build/leakcheck 100

      - name: Setup .NET 8 + 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.301

      - name: Restore (locked)
        run: dotnet restore H3.NET.Native.slnx --locked-mode

      - name: Build
        run: dotnet build H3.NET.Native.slnx -c Release --no-restore

      - name: Managed soak
        env:
          H3_SOAK_ITERS: "5000000"
        run: dotnet test tests/H3.NET.Native.MemoryTests/H3.NET.Native.MemoryTests.csproj -c Release -f net10.0 --no-build --filter "Category=Soak"

      # NOTE: the ASan/LSan LD_PRELOAD gate that exercises libh3 as loaded by the
      # dotnet host lives in the separate `asan-linux` job below (it needs a CLR
      # LSan suppressions file, tests/H3.NET.Native.MemoryTests/lsan.supp).

  # AddressSanitizer/LeakSanitizer gate that exercises libh3 AS LOADED BY THE
  # DOTNET HOST (complementary to memory-linux's pure-C valgrind harness). It
  # rebuilds libh3 with -fsanitize=address into a separate build tree, then runs
  # the managed soak with gcc's libasan preloaded into the dotnet process so ASan
  # instruments the whole host. Heap/stack buffer overflow, use-after-free, and
  # double-free in libh3 or the binding path fail immediately (exitcode=1) and are
  # NOT suppressible; LSan leak reports are filtered by lsan.supp down to leaks
  # attributable to libh3 (CLR/JIT/ICU/loader noise is ignored). Hard gate since
  # 2026-07-03, after a 5-green soak-in of the ASan+CLR leak-signal interaction
  # (it could not be validated locally: no linux container runtime on the dev box).
  asan-linux:
    name: asan-linux
    runs-on: ubuntu-latest
    env:
      # Defer signal handling to the CLR (it installs its own SIGSEGV handler for
      # null-ref/GC write barriers and manages alt stacks), enable leak detection,
      # and exit non-zero on any finding. alloc_dealloc_mismatch is off because the
      # whole (mostly uninstrumented) process is intercepted and pure-C libh3 never
      # mismatches; odr/tls interceptors are relaxed to avoid cross-module false
      # positives. Do NOT raise malloc_context_size (see lsan.supp for why).
      ASAN_OPTIONS: "detect_leaks=1:handle_segv=0:allow_user_segv_handler=1:use_sigaltstack=0:abort_on_error=0:exitcode=1:alloc_dealloc_mismatch=0:detect_odr_violation=0:intercept_tls_get_addr=0:symbolize=1"
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/tests/H3.NET.Native.MemoryTests/lsan.supp:print_suppressions=0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Fewer helper processes (each preloaded child runs its own LSan at exit).
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      # W^X JIT page protection conflicts with ASan's shadow-memory management.
      DOTNET_EnableWriteXorExecute: "0"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      # ubuntu-latest ships gcc + its matching libasan; ensure present for both the
      # instrumented build AND the runtime preload (the .so and the preloaded
      # runtime MUST come from the same toolchain).
      - name: Install gcc + libasan
        run: sudo apt-get update && sudo apt-get install -y gcc

      # Rebuilds libh3 with -fsanitize=address (separate external/h3/build-asan
      # tree) and stages it into runtimes/linux-x64/native so the eng/ copy target
      # places the instrumented .so next to the test binaries -- the exact path the
      # soak resolves libh3 from. This is an isolated job workspace, so nothing the
      # shipping jobs produce is disturbed.
      - name: Build native (linux-x64, asan)
        run: bash build/build-native.sh linux-x64 --asan

      - name: Setup .NET 8 + 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.301

      - name: Restore (locked)
        run: dotnet restore H3.NET.Native.slnx --locked-mode

      - name: Build
        run: dotnet build H3.NET.Native.slnx -c Release --no-restore

      # Resolve gcc's asan runtime path once; prefer the unversioned symlink, then
      # the versioned runtime, then a filesystem search, so the preload is robust
      # across gcc versions on the runner image.
      - name: Resolve libasan runtime
        run: |
          rt="$(gcc -print-file-name=libasan.so)"
          if [ ! -e "$rt" ]; then rt="$(gcc -print-file-name=libasan.so.8)"; fi
          if [ ! -e "$rt" ]; then
            rt="$(find /usr/lib /usr/lib/gcc /usr/lib64 -name 'libasan.so.*' 2>/dev/null | sort -V | tail -n1)"
          fi
          test -e "$rt" || { echo "error: libasan runtime not found"; exit 1; }
          echo "Resolved libasan: $rt"
          echo "ASAN_RT=$rt" >> "$GITHUB_ENV"

      # Preload libasan ONLY for this command (never for restore/build, which must
      # not be instrumented), and run the xunit.v3 in-process runner executable
      # directly instead of `dotnet test`: the VSTest path preloads ASan into its
      # whole process tree (console + testhost + assembly-info child), and the
      # assembly-info child's stdout JSON handshake is timing-sensitive under ASan
      # ("Catastrophic failure: Test process did not return valid JSON", PR #35).
      # Direct execution instruments exactly one process — the only one LSan needs
      # to analyze. The soak exercises the scalar hot paths and the heap-owning
      # FromCells success + pre-allocation error branches every iteration; a
      # moderate iteration count keeps ASan's ~2-3x slowdown / extra RSS within
      # runner limits while still stressing the buffer-sizing and
      # LinkedGeoPolygon teardown paths hard.
      - name: Managed soak under ASan/LSan
        env:
          LD_PRELOAD: ${{ env.ASAN_RT }}
          H3_SOAK_ITERS: "300000"
          # ASan legitimately inflates RSS (shadow memory, redzones, freed-memory
          # quarantine), so the soak's RSS-growth heuristic false-positives here.
          # LSan is the leak oracle in this job; the managed-heap bound stays active.
          H3_SOAK_CHECK_RSS: "0"
        run: |
          dotnet exec tests/H3.NET.Native.MemoryTests/bin/Release/net10.0/H3.NET.Native.MemoryTests.dll \
            -trait "Category=Soak"

  # Warn-only: prove the benchmarks project builds and runs a tiny smoke (a dry
  # BenchmarkDotNet job: one op per benchmark, no statistics). Never gates.
  benchmarks:
    name: benchmarks
    needs: native-build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download native linux-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.301

      - name: Restore (locked)
        run: dotnet restore H3.NET.Native.slnx --locked-mode

      - name: Build benchmarks
        run: dotnet build tests/H3.NET.Native.Benchmarks/H3.NET.Native.Benchmarks.csproj -c Release --no-restore

      # Tiny smoke: --job dry runs a single op per benchmark (no warmup/statistics),
      # so every benchmark and the real pocketken A/B actually execute fast and
      # non-flaky. Warn-only via the job's continue-on-error; never gates CI.
      - name: Run benchmarks smoke (dry job)
        run: |
          dotnet run --project tests/H3.NET.Native.Benchmarks/H3.NET.Native.Benchmarks.csproj \
            -c Release --no-build -- --filter '*' --job dry
